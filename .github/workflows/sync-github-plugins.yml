name: Sync GitHub plugins

on:
  schedule:
    # GitHub cron uses UTC: 00:17 and 12:17 UTC are 08:17 and 20:17 Singapore time.
    - cron: "17 0,12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-github-plugins
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATABASE_URL: file:./marketplace.db
      MARKETPLACE_GITHUB_TOKEN: ${{ secrets.MARKETPLACE_GITHUB_TOKEN }}

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report GitHub search coverage
        run: |
          if [[ -z "$MARKETPLACE_GITHUB_TOKEN" ]]; then
            echo "::warning::MARKETPLACE_GITHUB_TOKEN is not configured. Refreshing priority repositories only; broad GitHub Code Search is skipped."
          fi

      - name: Discover and refresh GitHub plugins
        if: env.MARKETPLACE_GITHUB_TOKEN != ''
        # Six windows: newest and oldest 1,000 results for each manifest family.
        # A quota-limited run keeps only plugins whose transactions completed.
        env:
          GITHUB_TOKEN: ${{ env.MARKETPLACE_GITHUB_TOKEN }}
        run: npm run index:github -- --max 6000 --allow-partial

      - name: Refresh priority repositories without code search
        if: env.MARKETPLACE_GITHUB_TOKEN == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run index:github -- --priority-only --allow-partial

      - name: Validate the refreshed snapshot
        run: |
          npm run db:validate
          npm test
          npm run lint

      - name: Commit and push snapshot changes
        run: |
          if git diff --quiet -- prisma/marketplace.db; then
            echo "The marketplace snapshot is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/marketplace.db
          git commit -m "chore(index): refresh GitHub plugin snapshot"
          git push origin HEAD:main
