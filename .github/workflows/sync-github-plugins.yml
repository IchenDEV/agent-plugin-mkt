name: Sync GitHub plugins

on:
  schedule:
    # GitHub cron uses UTC: 00:17 and 12:17 UTC are 08:17 and 20:17 Singapore time.
    - cron: "17 0,12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-github-plugins
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATABASE_URL: file:./marketplace.db
      # A higher-limit token is optional; the repository token remains a safe fallback.
      GITHUB_TOKEN: ${{ secrets.MARKETPLACE_GITHUB_TOKEN || github.token }}
      HAS_MARKETPLACE_TOKEN: ${{ secrets.MARKETPLACE_GITHUB_TOKEN != '' }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Choose exhaustive or rotating scan
        run: |
          if [[ "$HAS_MARKETPLACE_TOKEN" == "true" ]]; then
            echo "SYNC_MAX=6000" >> "$GITHUB_ENV"
            echo "Using both complete 1,000-result windows for every manifest family."
          else
            epoch=$(date -u +%s)
            page=$((epoch / 43200 % 100 + 1))
            echo "SYNC_MAX=60" >> "$GITHUB_ENV"
            echo "SYNC_PAGE=$page" >> "$GITHUB_ENV"
            echo "SYNC_PAGE_SIZE=10" >> "$GITHUB_ENV"
            echo "Using rotating page $page of 100 with the repository token."
          fi

      - name: Discover and refresh GitHub plugins
        shell: bash
        run: |
          args=(--max "$SYNC_MAX")
          if [[ -n "${SYNC_PAGE:-}" ]]; then
            args+=(--search-page "$SYNC_PAGE" --search-page-size "$SYNC_PAGE_SIZE")
          fi
          npm run index:github -- "${args[@]}"

      - name: Validate the refreshed snapshot
        run: |
          npm run db:validate
          npm test
          npm run lint

      - name: Commit and push snapshot changes
        run: |
          if git diff --quiet -- prisma/marketplace.db; then
            echo "The marketplace snapshot is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/marketplace.db
          git commit -m "chore(index): refresh GitHub plugin snapshot"
          git push origin HEAD:main
